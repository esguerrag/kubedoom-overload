---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubedoom
  namespace: kubedoom
spec:
  podSelector:
    matchLabels:
      app: kubedoom
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow VNC traffic on port 5900 from any source.
    - from: []
      ports:
        - protocol: TCP
          port: 5900
  egress:
    # Allow DNS resolution to kube-system (CoreDNS).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow access to the Kubernetes API server.
    # Adjust the ipBlock CIDRs to match your cluster's control-plane / service CIDR if desired.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
